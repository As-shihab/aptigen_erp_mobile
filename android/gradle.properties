org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Project (D:) and pub cache (C:) are on different drives — Kotlin's
# incremental cache can't relativize plugin paths and dumps stack traces
# (build still succeeds). Full compile avoids the noise.
kotlin.incremental=false
